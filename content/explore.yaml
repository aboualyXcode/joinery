  journey: |
    SELECT c.country, count(*) AS orders
    FROM orders AS o
    JOIN customers AS c ON c.id = o.customer_id
    WHERE o.ordered_at >= '2026-01-01'
    GROUP BY c.country
    ORDER BY orders DESC;
  processing:
    - [SELECT, "c.country, count(*) AS orders", 5]
    - [FROM, "orders AS o JOIN customers AS c ON c.id = o.customer_id", 1]
    - [WHERE, "o.status = 'delivered'", 2]
    - [GROUP BY, "c.country", 3]
    - [HAVING, "count(*) > 20", 4]
    - [ORDER BY, "orders DESC", 6]
    - [LIMIT, "5", 7]
  playground:
    shop: "SELECT c.country, count(*) AS orders, round(sum(p.amount), 2) AS revenue\nFROM orders AS o\nJOIN customers AS c ON c.id = o.customer_id\nJOIN payments AS p ON p.order_id = o.id AND p.status = 'captured'\nGROUP BY c.country\nORDER BY revenue DESC;"
    bank: "SELECT m.category, count(*) AS purchases, round(-sum(t.amount), 2) AS spent\nFROM transactions AS t\nJOIN merchants AS m ON m.id = t.merchant_id\nWHERE t.kind = 'card'\nGROUP BY m.category\nORDER BY spent DESC;"
    analytics: "SELECT name, count(*) AS events, count(DISTINCT user_id) AS users\nFROM events\nGROUP BY name\nORDER BY events DESC;"
    pipeline: "SELECT load_id, count(*) AS rows_received, count(DISTINCT order_ref) AS distinct_orders\nFROM raw_orders\nGROUP BY load_id;"
    joinlab: "SELECT p.name AS player, t.name AS team\nFROM players AS p\nLEFT JOIN teams AS t ON t.id = p.team_id;"
  join_lab:
    players: SELECT id, name, team_id, role FROM players ORDER BY id
    teams: SELECT id, name, city FROM teams ORDER BY id
    sql:
      inner: "SELECT p.name AS player, t.name AS team\nFROM players AS p\nJOIN teams AS t ON t.id = p.team_id;"
      left: "SELECT p.name AS player, t.name AS team\nFROM players AS p\nLEFT JOIN teams AS t ON t.id = p.team_id;"
      right: "SELECT p.name AS player, t.name AS team\nFROM players AS p\nRIGHT JOIN teams AS t ON t.id = p.team_id;"
      full: "SELECT p.name AS player, t.name AS team\nFROM players AS p\nFULL JOIN teams AS t ON t.id = p.team_id;"
      cross: "SELECT p.name AS player, t.name AS team\nFROM players AS p\nCROSS JOIN teams AS t;"
      semi: "SELECT t.name AS team\nFROM teams AS t\nWHERE EXISTS (SELECT 1 FROM players AS p WHERE p.team_id = t.id);"
      anti: "SELECT t.name AS team\nFROM teams AS t\nWHERE NOT EXISTS (SELECT 1 FROM players AS p WHERE p.team_id = t.id);"
    notes:
      inner: Only pairs that satisfy the ON condition.
      left: Every player; no team means NULL team columns.
      right: Every team; no players means NULL player columns.
      full: Matched pairs plus the unmatched rows of both sides.
      cross: Every player with every team, 7 × 4 = 28 rows.
      semi: Teams with at least one player, each listed once.
      anti: Teams with no players.
  index_lab:
    - {title: "One customer's orders", table: orders, columns: [customer_id, status, ordered_at, channel], sql: "SELECT id, ordered_at, status\nFROM orders\nWHERE customer_id = 11"}
    - {title: Refunds this year by date, table: orders, columns: [status, ordered_at, channel, customer_id], sql: "SELECT id, ordered_at\nFROM orders\nWHERE status = 'refunded' AND ordered_at >= '2026-01-01'\nORDER BY ordered_at"}
    - {title: PayPal payments in June, table: payments, columns: [method, paid_at, order_id, amount], sql: "SELECT id, amount\nFROM payments\nWHERE method = 'paypal' AND paid_at >= '2026-06-01'"}
    - {title: Ratings for one product, table: reviews, columns: [product_id, rating, customer_id], sql: "SELECT rating, count(*) AS reviews\nFROM reviews\nWHERE product_id = 19\nGROUP BY rating"}
