id: troubleshooting
title: Troubleshooting
module: production
level: intermediate
minutes: 25
dataset: shop
summary: Diagnose errors, wrong results, slow queries and lock waits methodically, with a checklist for each.
objectives:
  - Classify an error as syntax, name resolution, constraint or runtime
  - "Find the cause of wrong results: fan-out, NULLs, filters on outer joins, integer division"
  - Work through a slow query step by step
  - Recognize lock waits, deadlocks and timeouts
sections:
  - title: Read the error first
    body: |
      Errors fall into a few families. **Syntax** errors come from the parser and name a nearby token.
      **Name** errors (unknown table or column, ambiguous column) come from the binder. **Constraint**
      errors name the violated rule. **Runtime** errors include timeouts, division problems and
      resource limits. Joinery adds a plain-language explanation and suggestions to every error. Read the
      first error carefully, fix it, and run again.
    examples:
      - id: trouble-typo
        title: A misspelled column
        sql: |
          SELECT id, ordred_at FROM orders LIMIT 5;
        expect: {error: no such column}
      - id: trouble-aggregate-where
        title: An aggregate in WHERE
        sql: |
          SELECT customer_id FROM orders WHERE count(*) > 5 GROUP BY customer_id;
        expect: {error: misuse of aggregate}
  - title: Wrong results
    body: |
      A query that runs is not necessarily right. Check these first:

      - **Fan-out**: a join to a one-to-many table repeats rows and inflates sums.
      - **NULLs**: `= NULL`, `NOT IN` with NULLs, and aggregates that skip NULLs.
      - **Outer join filters**: a `WHERE` condition on the right-hand table of a `LEFT JOIN` removes
        the NULL-padded rows and silently turns it into an inner join. Put such conditions in `ON`.
      - **Integer division** and rounding.
      - **Time**: half-open ranges, time zones and timestamps compared with dates.

      Step through the query and check the row count after every stage.
    examples:
      - id: trouble-left-join-where
        title: A LEFT JOIN that became an INNER JOIN
        dataset: joinlab
        sql: |
          -- Teams and their keepers. Three teams vanish:
          SELECT t.name AS team, p.name AS keeper
          FROM teams AS t
          LEFT JOIN players AS p ON p.team_id = t.id
          WHERE p.role = 'keeper';
        mode: steps
      - id: trouble-left-join-on
        title: The fix, with the condition in ON
        dataset: joinlab
        sql: |
          SELECT t.name AS team, p.name AS keeper
          FROM teams AS t
          LEFT JOIN players AS p ON p.team_id = t.id AND p.role = 'keeper';
        expect: {rows: 4}
        portable: true
  - title: Slow queries
    body: |
      1. Confirm the problem: measure the query on its own, with production-like data.
      2. Read the plan: full scans of large tables, nested loops over scans, sorts, correlated subqueries.
      3. Check estimates against reality: stale statistics produce bad plans.
      4. Check row counts at each stage: is a join multiplying rows?
      5. Fix the biggest cost first: an index, a sargable predicate, filtering earlier, a set-based rewrite.
      6. Measure again, and check that writes did not get slower.
  - title: Locks, deadlocks and timeouts
    body: |
      A query that is usually fast but sometimes hangs is often **waiting for a lock** held by another
      transaction, typically a long-running or forgotten open one. Look at the engine's activity views
      (`pg_stat_activity` and `pg_locks`, `performance_schema.data_locks`, `sys.dm_exec_requests`), find
      the blocker, and shorten transactions. Set `lock_timeout` and `statement_timeout` so a stuck query
      fails fast instead of piling up. SQLite reports `database is locked` when a writer waits too long;
      WAL mode and a busy timeout help.
exercises:
  - id: troubleshooting-keepers
    title: Keep every team
    dataset: joinlab
    prompt: Return every team as `team` with its keeper's name as `keeper`, or NULL when the team has no keeper. The starter loses three teams.
    starter: |
      SELECT t.name AS team, p.name AS keeper
      FROM teams AS t
      LEFT JOIN players AS p ON p.team_id = t.id
      WHERE p.role = 'keeper'
    solution: |
      SELECT t.name AS team, p.name AS keeper
      FROM teams AS t
      LEFT JOIN players AS p ON p.team_id = t.id AND p.role = 'keeper'
    hints:
      - "The `WHERE` clause throws away the NULL-padded rows."
      - "Move the condition on `p.role` into the `ON` clause."
  - id: troubleshooting-fanout
    title: Inflated totals
    prompt: |
      For orders 1 to 20, return `id`, `items_total` (the sum of `quantity * unit_price - discount`,
      rounded to 2) and `paid` (the sum of payment amounts, rounded to 2). The starter joins items and
      payments together and double counts.
    starter: |
      SELECT o.id,
             round(sum(i.quantity * i.unit_price - i.discount), 2) AS items_total,
             round(sum(p.amount), 2) AS paid
      FROM orders AS o
      JOIN order_items AS i ON i.order_id = o.id
      LEFT JOIN payments AS p ON p.order_id = o.id
      WHERE o.id <= 20
      GROUP BY o.id
    solution: |
      SELECT o.id,
             (SELECT round(sum(quantity * unit_price - discount), 2) FROM order_items AS i WHERE i.order_id = o.id) AS items_total,
             (SELECT round(sum(amount), 2) FROM payments AS p WHERE p.order_id = o.id) AS paid
      FROM orders AS o
      WHERE o.id <= 20
    hints:
      - "Every payment row is repeated once per line item."
      - "Aggregate each child table on its own, in subqueries or CTEs, then combine."
dialect_notes:
  postgres: "`pg_stat_activity`, `pg_locks` and `pg_blocking_pids()` find blockers; `log_lock_waits` logs long waits."
  mysql: "`SHOW ENGINE INNODB STATUS` reports the latest deadlock; `performance_schema.data_lock_waits` shows who waits for whom."
  mssql: "`sys.dm_exec_requests`, `sys.dm_tran_locks` and the system_health session's deadlock graphs."
  duckdb: "Single-process, optimistic concurrency: conflicts surface as transaction errors to retry rather than lock waits."
references:
  - title: PostgreSQL explicit locking
    url: https://www.postgresql.org/docs/current/explicit-locking.html
  - title: SQLite - file locking and concurrency
    url: https://www.sqlite.org/lockingv3.html
