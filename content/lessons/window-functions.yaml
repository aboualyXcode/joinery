id: window-functions
title: Window functions
module: combining
level: intermediate
minutes: 35
dataset: shop
summary: Compute rankings, running totals and row-to-row differences without collapsing rows, using OVER, PARTITION BY and frames.
objectives:
  - Explain how window functions differ from `GROUP BY`
  - Rank rows with `row_number`, `rank` and `dense_rank`
  - Compute running totals and moving averages with frames
  - Compare rows with `lag` and `lead`
sections:
  - title: Aggregates that keep the rows
    body: |
      `GROUP BY` collapses rows. A **window function** computes across a set of related rows, the
      *window*, and still returns every row. `OVER (PARTITION BY ...)` defines the groups; `ORDER BY`
      inside `OVER` orders rows within each partition.

      Window functions are evaluated after `WHERE`, `GROUP BY` and `HAVING`, which is why you cannot
      filter on them directly: wrap the query in a CTE and filter outside, or use DuckDB's `QUALIFY`.
    examples:
      - id: win-category-average
        title: Each product next to its category average
        sql: |
          SELECT name, category_id, unit_price,
                 round(avg(unit_price) OVER (PARTITION BY category_id), 2) AS category_avg
          FROM products
          ORDER BY category_id, unit_price DESC;
        portable: true
        mode: steps
  - title: Ranking and top N per group
    body: |
      `row_number()` numbers rows 1, 2, 3 within each partition. `rank()` gives ties the same number and
      leaves gaps (1, 1, 3); `dense_rank()` does not leave gaps (1, 1, 2). Ranking inside a CTE, then
      filtering on the rank, is the standard way to get the top N rows per group.
    examples:
      - id: win-top-two
        title: The two priciest products per category
        sql: |
          WITH ranked AS (
            SELECT category_id, name, unit_price,
                   row_number() OVER (PARTITION BY category_id ORDER BY unit_price DESC, id) AS rn
            FROM products
          )
          SELECT category_id, name, unit_price, rn
          FROM ranked
          WHERE rn <= 2
          ORDER BY category_id, rn;
        portable: true
        variants:
          duckdb: |
            SELECT category_id, name, unit_price,
                   row_number() OVER (PARTITION BY category_id ORDER BY unit_price DESC, id) AS rn
            FROM products
            QUALIFY rn <= 2
            ORDER BY category_id, rn;
  - title: Running totals and frames
    body: |
      With `ORDER BY` inside `OVER`, an aggregate becomes cumulative. The **frame** says which rows
      count: `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW` is a running total, and
      `ROWS BETWEEN 6 PRECEDING AND CURRENT ROW` is a seven-row moving window. The default frame is
      `RANGE ... CURRENT ROW`, which includes every row that ties with the current one: give the sort a
      unique tie-breaker so you get what you expect.
    examples:
      - id: win-running-balance
        title: A running account balance
        dataset: bank
        sql: |
          SELECT posted_at, description, amount,
                 round(sum(amount) OVER (ORDER BY posted_at, id
                                         ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW), 2) AS balance
          FROM transactions
          WHERE account_id = 7
          ORDER BY posted_at, id
          LIMIT 25;
        portable: true
  - title: Looking at neighbours with LAG and LEAD
    body: |
      `lag(x)` returns `x` from the previous row of the partition and `lead(x)` from the next. They make
      row-to-row differences easy: time between orders, change since last month, and so on.
    examples:
      - id: win-days-between
        title: Gaps between a customer's orders
        sql: |
          SELECT customer_id, id, ordered_at,
                 round(julianday(ordered_at)
                       - julianday(lag(ordered_at) OVER (PARTITION BY customer_id ORDER BY ordered_at)), 1)
                   AS days_since_previous
          FROM orders
          WHERE customer_id IN (10, 11)
          ORDER BY customer_id, ordered_at;
exercises:
  - id: window-top-product-per-category
    title: The priciest product in each category
    prompt: For each category, return `category_id`, `name` and `unit_price` of its most expensive product. On a tie, the product with the lowest `id` wins.
    starter: SELECT category_id, name, unit_price, row_number() OVER (ORDER BY unit_price DESC) AS rn FROM products
    solution: |
      WITH ranked AS (
        SELECT category_id, name, unit_price,
               row_number() OVER (PARTITION BY category_id ORDER BY unit_price DESC, id) AS rn
        FROM products
      )
      SELECT category_id, name, unit_price FROM ranked WHERE rn = 1
    hints:
      - "Number the rows within each category with `PARTITION BY category_id`."
      - "Filter on the row number in an outer query."
  - id: window-running-balance
    title: Running balance
    dataset: bank
    prompt: For account 7, return every transaction's `id`, `amount` and the running `balance` (rounded to 2) in posting order (`posted_at`, then `id`).
    starter: |
      SELECT id, amount, round(sum(amount) OVER (), 2) AS balance
      FROM transactions WHERE account_id = 7 ORDER BY posted_at, id
    solution: |
      SELECT id, amount,
             round(sum(amount) OVER (ORDER BY posted_at, id), 2) AS balance
      FROM transactions
      WHERE account_id = 7
      ORDER BY posted_at, id
    check: {order_matters: true}
    hints:
      - "An empty `OVER ()` sums the whole account."
      - "Add `ORDER BY posted_at, id` inside `OVER`."
  - id: window-order-gaps
    title: Days since the previous order
    prompt: For customer 11's orders, return `id`, `ordered_at` and `days_since`, the whole days since their previous order (NULL for the first), in date order.
    starter: |
      SELECT id, ordered_at, NULL AS days_since
      FROM orders WHERE customer_id = 11 ORDER BY ordered_at
    solution: |
      SELECT id, ordered_at,
             CAST(julianday(ordered_at) - julianday(lag(ordered_at) OVER (ORDER BY ordered_at)) AS INTEGER) AS days_since
      FROM orders
      WHERE customer_id = 11
      ORDER BY ordered_at
    check: {order_matters: true}
    hints:
      - "`lag(ordered_at) OVER (ORDER BY ordered_at)` is the previous order's timestamp."
dialect_notes:
  postgres: "Supports every frame mode (`ROWS`, `RANGE` with offsets, `GROUPS`) and `EXCLUDE`, plus ordered-set aggregates."
  mysql: "Window functions arrived in 8.0. There is no `GROUPS` frame mode."
  mssql: "Supports `ROWS` and `RANGE` frames (RANGE only with UNBOUNDED or CURRENT ROW). SQL Server 2022 added the `WINDOW` clause."
  duckdb: "`QUALIFY` filters on window results directly, and `arg_max`/`arg_min` often replace top-1-per-group queries."
references:
  - title: SQLite window functions
    url: https://www.sqlite.org/windowfunctions.html
  - title: PostgreSQL window functions tutorial
    url: https://www.postgresql.org/docs/current/tutorial-window.html
