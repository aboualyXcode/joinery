id: execution-plans
title: Reading execution plans
module: performance
level: advanced
minutes: 30
dataset: shop
summary: Read SQLite plan trees and bytecode, recognize the operators other engines report, and connect plans to the indexes and statistics behind them.
objectives:
  - Read SCAN, SEARCH, temporary B-trees, co-routines and correlated subqueries in a plan
  - Map plan loops to bytecode
  - Read PostgreSQL, MySQL, SQL Server and DuckDB plan operators
  - Use statistics to explain estimates
sections:
  - title: Reading a SQLite plan
    body: |
      A plan is a tree. Children run inside their parent, and siblings that read tables are nested
      loops, outermost first. The labels to know:

      - `SCAN t`: read every row. Fine for small tables or when most rows are needed.
      - `SEARCH t USING INDEX i (col=?)`: jump through an index. `COVERING INDEX` means the table itself
        is never read.
      - `USE TEMP B-TREE FOR ORDER BY` (or `GROUP BY`, `DISTINCT`): an extra sort.
      - `AUTOMATIC COVERING INDEX`: SQLite built a temporary index because none existed.
      - `CORRELATED SCALAR SUBQUERY`: a subquery re-run for each outer row.
      - `CO-ROUTINE` and `MATERIALIZE`: a subquery or CTE streamed or stored.
    examples:
      - id: plan-join
        title: A nested-loop join
        sql: |
          SELECT c.email, o.id, o.ordered_at
          FROM customers AS c
          JOIN orders AS o ON o.customer_id = c.id
          WHERE c.country = 'SE';
        mode: plan
      - id: plan-sort
        title: Grouping and sorting
        sql: |
          SELECT shipping_country, count(*) AS orders
          FROM orders
          GROUP BY shipping_country
          ORDER BY orders DESC;
        mode: plan
      - id: plan-correlated
        title: A correlated subquery
        sql: |
          SELECT p.name,
                 (SELECT count(*) FROM order_items AS i WHERE i.product_id = p.id) AS times_sold
          FROM products AS p;
        mode: plan
  - title: Bytecode, the physical program
    body: |
      SQLite compiles every statement into a program for its virtual machine. A full scan is a loop:
      `Rewind` positions a cursor on the first row, `Column` reads values, `ResultRow` emits a row and
      `Next` jumps back to the top of the loop. An index search starts with `SeekGE` and stops with
      `IdxGT`. The Plan tab lists the program with an explanation of each opcode and marks the loops.
    examples:
      - id: plan-bytecode
        title: One loop over one table
        sql: |
          SELECT name, unit_price FROM products WHERE unit_price > 50;
        mode: plan
  - title: Plans in other engines
    body: |
      PostgreSQL reports operators such as `Seq Scan`, `Index Scan`, `Index Only Scan`, `Bitmap Heap
      Scan`, `Nested Loop`, `Hash Join`, `Merge Join`, `Sort` and `HashAggregate`. With `ANALYZE` each
      node shows estimated **and** actual rows. A large gap between them points at stale or missing
      statistics, the usual reason a plan goes wrong.

      MySQL's `EXPLAIN ANALYZE` prints a similar tree. SQL Server shows graphical estimated and actual
      plans and keeps their history in Query Store. DuckDB's `EXPLAIN ANALYZE` adds per-operator timing.
    examples:
      - id: plan-explain-syntax
        title: Asking each engine for a plan
        sql: |
          EXPLAIN QUERY PLAN
          SELECT status, count(*) FROM orders WHERE ordered_at >= '2026-01-01' GROUP BY status;
        variants:
          postgres: |
            EXPLAIN (ANALYZE, BUFFERS)
            SELECT status, count(*) FROM orders WHERE ordered_at >= '2026-01-01' GROUP BY status;
          mysql: |
            EXPLAIN ANALYZE
            SELECT status, count(*) FROM orders WHERE ordered_at >= '2026-01-01' GROUP BY status;
          duckdb: |
            EXPLAIN ANALYZE
            SELECT status, count(*) FROM orders WHERE ordered_at >= '2026-01-01' GROUP BY status;
exercises:
  - id: plans-statistics
    title: What the optimizer knows
    prompt: Return `tbl`, `idx` and `stat` from `sqlite_stat1` for the `orders` table. The first number in `stat` is the table's row count.
    starter: SELECT tbl, idx, stat FROM sqlite_stat1
    solution: SELECT tbl, idx, stat FROM sqlite_stat1 WHERE tbl = 'orders'
    hints:
      - "Filter on `tbl`."
  - id: plans-search-payments
    title: Turn a scan into a search
    prompt: |
      This query scans every payment:
      `SELECT id, amount FROM payments WHERE method = 'gift_card' AND paid_at >= '2026-01-01'`.
      In one script, create an index that lets SQLite **search** payments instead, then run the query.
      Joinery checks both the result and the plan.
    starter: SELECT id, amount FROM payments WHERE method = 'gift_card' AND paid_at >= '2026-01-01'
    solution: |
      CREATE INDEX idx_payments_method_paid ON payments (method, paid_at);
      SELECT id, amount FROM payments WHERE method = 'gift_card' AND paid_at >= '2026-01-01';
    check: {plan: {searched: [payments]}}
    hints:
      - "Equality column first, then the range column."
dialect_notes:
  postgres: "Use `EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON)` for tooling; `auto_explain` logs slow plans automatically. PostgreSQL 19 is expected to add plan advice for stabilizing plans."
  mysql: "`EXPLAIN FORMAT=JSON` includes cost estimates; `optimizer_trace` shows why a plan was chosen."
  mssql: "`SET STATISTICS IO, TIME ON` reports reads and timings; Query Store can force a known good plan."
  duckdb: "`EXPLAIN ANALYZE` reports each operator's cardinality and time; `PRAGMA enable_profiling` writes profiles."
references:
  - title: SQLite EXPLAIN QUERY PLAN
    url: https://www.sqlite.org/eqp.html
  - title: SQLite bytecode engine
    url: https://www.sqlite.org/opcode.html
  - title: PostgreSQL using EXPLAIN
    url: https://www.postgresql.org/docs/current/using-explain.html
